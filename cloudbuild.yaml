steps:
# Build and deploy Telegram interface
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', '$LOCATION-docker.pkg.dev/$PROJECT_ID/telegram-app/app:latest', '-f', 'Dockerfile.telegram', '.']
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', '$LOCATION-docker.pkg.dev/$PROJECT_ID/telegram-app/app:latest']
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args: ['run', 'deploy', 'telegram-bot', 
  '--image', '$LOCATION-docker.pkg.dev/$PROJECT_ID/telegram-app/app:latest', 
  '--port', '8080',
  '--region', '$LOCATION',
  '--platform', 'managed',
  '--allow-unauthenticated',
  '--project', '$PROJECT_ID',
  '--memory', '4Gi',
  '--min-instances', '1',
  '--max-instances', '1',
  '--timeout', '120',
  '--add-volume', 'name=short-term-memory,type=in-memory,size-limit=1Gi',
  '--add-volume-mount', 'volume=short-term-memory,mount-path=/app/data',
  '--update-secrets', 'GROQ_API_KEY=GROQ_API_KEY:latest,ELEVENLABS_API_KEY=ELEVENLABS_API_KEY:latest,ELEVENLABS_VOICE_ID=ELEVENLABS_VOICE_ID:latest,TOGETHER_API_KEY=TOGETHER_API_KEY:latest,QDRANT_URL=QDRANT_URL:latest,QDRANT_API_KEY=QDRANT_API_KEY:latest,TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:latest,TELEGRAM_WEBHOOK_URL=TELEGRAM_WEBHOOK_URL:latest']

images:
- $LOCATION-docker.pkg.dev/$PROJECT_ID/telegram-app/app:latest
